[project]
name = "workkbot-backend"
version = "0.1.0"
description = "Workkbot Cloud Run Backend: FastAPI, Google ADK 2.0 & Supabase Auth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "pyjwt[crypto]>=2.10.0",
    "cryptography>=43.0.0",
    "supabase>=2.10.0",
    "google-adk>=2.6.0",
    "google-genai>=1.0.0",
    "sse-starlette>=2.0.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.8.0",
    "google-cloud-dlp>=3.18.0",
    "google-cloud-logging>=3.11.0",
    "composio>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live_gemini: Tests making real outbound network calls to Google Gemini API",
    "live_dlp: Tests making real outbound network calls to Google Cloud DLP API in asia-south1",
    "live_gcp: Tests making real outbound network calls to Google Cloud Logging or other GCP APIs",
]
