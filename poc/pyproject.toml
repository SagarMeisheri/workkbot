[project]
name = "workkbot-poc"
version = "0.1.0"
description = "Workkbot Local Proof of Concept (Google ADK 2.0 & Dynamic MCP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "google-adk>=2.6.2",
    "google-genai>=1.0.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
